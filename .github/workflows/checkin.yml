name: 每日签到

on:
  schedule:
    # 每天两次触发(签到是幂等的, 已签到会自动跳过):
    # UTC 00:10 = 北京时间 08:10 (主)
    # UTC 12:10 = 北京时间 20:10 (兜底, 防止 GitHub 调度丢失)
    - cron: '10 0 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check-in
        env:
          RAINYUN_API_KEY: ${{ secrets.RAINYUN_API_KEY }}
          HMC_EMAIL: ${{ secrets.HMC_EMAIL }}
          HMC_PASSWORD: ${{ secrets.HMC_PASSWORD }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python checkin.py
